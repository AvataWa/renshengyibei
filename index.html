<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>人生一杯 · 预览</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #2b3a42;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: min(100vw, 56.25vh); /* 竖屏 9:16 */
      height: min(100vh, 177.78vw);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
  </div>
  <script>
    // 让浏览器以舞台尺寸作为逻辑窗口（模拟手机竖屏）
    (function () {
      var stage = document.getElementById('stage');
      var rect = stage.getBoundingClientRect();
      var realInnerWidth = window.innerWidth;
      var realInnerHeight = window.innerHeight;
      Object.defineProperty(window, 'innerWidth', { get: function () { return stage.clientWidth || realInnerWidth; } });
      Object.defineProperty(window, 'innerHeight', { get: function () { return stage.clientHeight || realInnerHeight; } });
    })();
  </script>
  <script src="src/tiers.config.js"></script>
  <script src="src/lines.js"></script>
  <script src="src/cups.js"></script>
  <script src="src/containers.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
