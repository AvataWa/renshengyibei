<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>杯型编辑器 · 人生一杯</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f4f1ea; color: #33332e; display: flex; height: 100vh; overflow: hidden; }
  /* 左侧杯型列表 */
  #list { width: 220px; background: #fff; border-right: 1px solid #e2ddd0; overflow-y: auto; flex-shrink: 0; }
  #list h2 { font-size: 14px; padding: 14px 14px 8px; color: #8a8574; font-weight: 600; }
  #list .grp { padding: 10px 14px 4px; font-size: 11px; color: #b0aa97; }
  #list .item { padding: 8px 14px; font-size: 13px; cursor: pointer; border-left: 3px solid transparent; }
  #list .item:hover { background: #f7f4ec; }
  #list .item.on { background: #fdf6e3; border-left-color: #e8a33d; font-weight: 600; }
  #list .item .sub { font-size: 11px; color: #a8a291; margin-top: 2px; }
  #newBtn { margin: 12px 14px; width: calc(100% - 28px); padding: 9px 0; border: 1px dashed #c9c2ae;
            background: none; border-radius: 8px; cursor: pointer; font-size: 13px; color: #8a8574; }
  #newBtn:hover { background: #f7f4ec; }
  /* 中间画布 */
  #stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  #cv { background: #fdfcf8; border: 1px solid #e2ddd0; border-radius: 12px; cursor: crosshair; touch-action: none; }
  #tip { margin-top: 10px; font-size: 12px; color: #a8a291; }
  /* 右侧属性面板 */
  #panel { width: 320px; background: #fff; border-left: 1px solid #e2ddd0; overflow-y: auto;
           padding: 16px; flex-shrink: 0; }
  #panel h3 { font-size: 13px; color: #8a8574; margin: 16px 0 8px; font-weight: 600; }
  #panel h3:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .row label { width: 64px; flex-shrink: 0; color: #6b6656; }
  .row input[type=text] { flex: 1; padding: 6px 8px; border: 1px solid #ddd6c4; border-radius: 6px; font-size: 13px; }
  .row input[type=range] { flex: 1; }
  .row .val { width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: #8a8574; font-size: 12px; }
  #stats { font-size: 12px; line-height: 1.9; color: #6b6656; background: #f7f4ec; border-radius: 8px; padding: 10px 12px; }
  #stats b { color: #33332e; }
  .warn { color: #c0392b !important; }
  #speedCv { width: 100%; height: 90px; background: #fdfcf8; border: 1px solid #e2ddd0; border-radius: 8px; }
  .btn { display: block; width: 100%; padding: 10px 0; margin-bottom: 8px; border: none; border-radius: 8px;
         font-size: 14px; cursor: pointer; }
  #saveBtn { background: #e8a33d; color: #fff; font-weight: 600; }
  #saveBtn:hover { background: #d8932c; }
  #copyBtn { background: #efead9; color: #6b6656; }
  #resetBtn { background: none; border: 1px solid #ddd6c4; color: #a8a291; }
  #codeOut { width: 100%; height: 150px; font-family: Consolas, monospace; font-size: 11px;
             border: 1px solid #e2ddd0; border-radius: 8px; padding: 8px; resize: vertical;
             background: #fdfcf8; color: #6b6656; }
  #toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: #33332e;
           color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0;
           transition: opacity .25s; pointer-events: none; z-index: 9; }
</style>
</head>
<body>
<div id="list">
  <h2>杯型库</h2>
  <div id="items"></div>
  <button id="newBtn">＋ 新建杯型</button>
</div>
<div id="stage">
  <canvas id="cv" width="480" height="620"></canvas>
  <div id="tip">拖动圆点调杯壁 · 菱形节点调杯把（上下两个=附着高度，右侧=外扩大小）· 黄带=合格区 绿带=完美区 · 红虚线=杯口最小宽度</div>
</div>
<div id="panel">
  <h3>基础信息</h3>
  <div class="row"><label>名称</label><input type="text" id="fName"></div>
  <div class="row"><label>提示语</label><input type="text" id="fHint"></div>
  <div class="row"><label>高宽比</label><input type="range" id="fAspect" min="0.4" max="3.2" step="0.05"><span class="val" id="vAspect"></span></div>
  <div class="row"><label>大小</label><input type="range" id="fSize" min="0.6" max="1.4" step="0.02"><span class="val" id="vSize"></span></div>
  <div class="row"><label>高脚杯</label><input type="checkbox" id="fStem"></div>
  <div class="row"><label>所属段位</label><select id="fPool" style="flex:1;padding:6px;border:1px solid #ddd6c4;border-radius:6px;font-size:13px">
    <option value="0">倒奶</option><option value="1">可乐</option><option value="2">啤酒</option>
    <option value="3">红酒</option><option value="4">白酒</option><option value="5">茶</option>
  </select></div>
  <h3>合格区（完美区自动取顶部 1/3）</h3>
  <div class="row"><label>下限</label><input type="range" id="fQlo" min="0.1" max="0.9" step="0.01"><span class="val" id="vQlo"></span></div>
  <div class="row"><label>上限</label><input type="range" id="fQhi" min="0.3" max="1.0" step="0.01"><span class="val" id="vQhi"></span></div>
  <h3>装饰</h3>
  <div class="row"><label>描边颜色</label><input type="color" id="fWall" style="width:48px;height:28px;border:1px solid #ddd6c4;border-radius:6px;background:none;padding:2px"></div>
  <div class="row"><label>描边粗细</label><input type="range" id="fWallW" min="2" max="8" step="0.5"><span class="val" id="vWallW"></span></div>
  <div class="row"><label>玻璃质感</label><input type="range" id="fGlass" min="0" max="0.8" step="0.05"><span class="val" id="vGlass"></span></div>
  <div class="row"><label>刻度线</label><input type="range" id="fTicks" min="0" max="8" step="1"><span class="val" id="vTicks"></span></div>
  <div class="row"><label>分隔虚线</label><input type="checkbox" id="fDash" checked></div>
  <div class="row"><label>杯把</label><input type="checkbox" id="fHandle"></div>
  <h3>数据</h3>
  <div id="stats"></div>
  <h3>水位上升节奏（越高峰 = 涨得越快越危险）</h3>
  <canvas id="speedCv" width="288" height="90"></canvas>
  <h3>操作</h3>
  <button class="btn" id="saveBtn">保存到 cups.js</button>
  <button class="btn" id="copyBtn">复制代码</button>
  <button class="btn" id="resetBtn">重置为载入时的样子</button>
  <h3>生成的代码</h3>
  <textarea id="codeOut" readonly></textarea>
</div>
<div id="toast"></div>
<script src="src/cups.js"></script>
<script src="src/cups-lab.js"></script>
<script>
(function () {
  'use strict';
  var NPTS = 17;               // 控制点数量（t = 0, 1/16, ..., 1）
  var GAME_H = 800, GAME_W = 450, MOUTH_MIN = 18; // 与 game.js 一致的参考几何
  var PASS_FIELDS = ['sprite', 'sprHFrac', 'sprBFrac']; // 保存时原样保留的额外字段
  var DECO_DEF = { wall: '#2B2A26', wallW: 4.5, glass: 0.45, dash: true, ticks: 0, handle: false }; // 与 game.js 默认值一致

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var speedCv = document.getElementById('speedCv'), sctx = speedCv.getContext('2d');

  // 当前编辑状态
  var cur = null;       // {name,hint,aspect,size,stem,qlo,qhi,pts:[],pass:{},index}
  var snapshot = null;  // 载入时的快照，供重置

  // ---------- 数据 ----------
  function sampleProfile(profile) {
    var pts = [];
    for (var i = 0; i < NPTS; i++) {
      var v = profile(i / (NPTS - 1));
      pts.push(Math.round(Math.max(0.05, Math.min(1, v)) * 1000) / 1000);
    }
    return pts;
  }

  function loadCup(index) {
    var cup = Cups.CUPS[index];
    var pass = {};
    PASS_FIELDS.forEach(function (f) { if (cup[f] !== undefined) pass[f] = cup[f]; });
    var deco = {};
    for (var k in DECO_DEF) if (k !== 'handle') deco[k] = (cup.deco && cup.deco[k] !== undefined) ? cup.deco[k] : DECO_DEF[k];
    var hd = cup.deco && cup.deco.handle, ho = (typeof hd === 'object' && hd) ? hd : {};
    deco.handle = { on: !!hd,
      t1: ho.t1 != null ? ho.t1 : 0.82,
      t2: ho.t2 != null ? ho.t2 : 0.45,
      out: ho.out != null ? ho.out : 0.62 };
    cur = {
      index: index,
      name: cup.name, hint: cup.hint,
      aspect: cup.aspect, size: cup.size || 1, stem: !!cup.stem,
      pool: cup.pool || 0,
      qlo: cup.zones.q[0], qhi: cup.zones.q[1],
      pts: sampleProfile(cup.profile),
      pass: pass, deco: deco
    };
    snapshot = JSON.parse(JSON.stringify(cur));
    syncPanel(); draw(); drawSpeed(); genCode();
    renderList();
  }

  function newCup() {
    var pts = [];
    for (var i = 0; i < NPTS; i++) pts.push(i === 0 ? 0.6 : 0.7);
    var deco = {};
    for (var k in DECO_DEF) if (k !== 'handle') deco[k] = DECO_DEF[k];
    deco.handle = { on: false, t1: 0.82, t2: 0.45, out: 0.62 };
    cur = { index: null, name: '新杯型', hint: '八分满', aspect: 1.4, size: 1.0,
            stem: false, pool: cur ? cur.pool : 0, qlo: 0.62, qhi: 0.86, pts: pts, pass: {}, deco: deco };
    snapshot = JSON.parse(JSON.stringify(cur));
    syncPanel(); draw(); drawSpeed(); genCode(); renderList();
  }

  // ---------- 曲线（与 cups.js tableProfile 相同算法） ----------
  function profileAt(t) {
    var pts = cur.pts, n = pts.length - 1;
    var x = Math.max(0, Math.min(1, t)) * n;
    var i = Math.min(Math.floor(x), n - 1), u = x - i;
    var p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, n)];
    var v = 0.5 * ((2 * p1) + (-p0 + p2) * u +
      (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u +
      (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
    return Math.max(0.05, Math.min(1, v));
  }
  function avgW() { var s = 0, N = 40; for (var i = 0; i <= N; i++) s += profileAt(i / N); return s / (N + 1); }

  // 与 game.js 相同的杯型几何
  function geom() {
    var cupH = GAME_H * 0.28 * cur.size;
    var halfW = cupH / (2 * cur.aspect);
    var maxHalf = GAME_W * 0.33;
    if (halfW > maxHalf) { halfW = maxHalf; cupH = halfW * 2 * cur.aspect; }
    var rimW = profileAt(1) * halfW, widened = false;
    if (rimW < MOUTH_MIN) { halfW = MOUTH_MIN / profileAt(1); widened = true; }
    return { cupH: cupH, halfW: halfW, widened: widened };
  }

  // ---------- 主画布 ----------
  var PAD = 30;
  function layout() {
    var g = geom();
    var scale = Math.min((cv.width - PAD * 2) / (g.halfW * 2), (cv.height - PAD * 2 - 40) / (g.cupH * (cur.stem ? 1.2 : 1)));
    var cx = cv.width / 2, baseY = cv.height - PAD - (cur.stem ? g.cupH * 0.2 * scale : 0);
    return { g: g, scale: scale, cx: cx, baseY: baseY };
  }
  function ptXY(t, w, L) { // 杯壁上一点 → 画布坐标（右侧）
    return { x: L.cx + w * L.g.halfW * L.scale, y: L.baseY - t * L.g.cupH * L.scale };
  }

  function cupPath(L, inset) {
    var i, N = 48, p;
    ctx.beginPath();
    for (i = 0; i <= N; i++) {
      var t = i / N, w = profileAt(t) * (1 - inset);
      p = ptXY(t, -w, L);
      i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    }
    for (i = N; i >= 0; i--) {
      var t2 = i / N, w2 = profileAt(t2) * (1 - inset);
      p = ptXY(t2, w2, L);
      ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
  }

  // 杯壁开口路径：左壁(顶→底) + 底边 + 右壁(底→顶)，杯口不画线（与游戏 traceCupWall 一致）
  function wallPath(L) {
    var i, N = 48, p;
    ctx.beginPath();
    for (i = N; i >= 0; i--) {
      p = ptXY(i / N, -profileAt(i / N), L);
      i === N ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    }
    for (i = 0; i <= N; i++) {
      p = ptXY(i / N, profileAt(i / N), L);
      ctx.lineTo(p.x, p.y);
    }
  }

  function draw() {
    if (!cur) return;
    var L = layout(), g = L.g;
    ctx.clearRect(0, 0, cv.width, cv.height);

    // 玻璃质感：左侧随杯壁弯曲的白色半透高光带（与游戏一致）
    if (cur.deco.glass > 0) {
      var GN = 24, gi, gt, gw0, gy0;
      ctx.beginPath();
      for (gi = 0; gi <= GN; gi++) {
        gt = 0.06 + 0.88 * (gi / GN);
        gw0 = profileAt(gt) * L.g.halfW * 0.80 * L.scale;
        gy0 = L.baseY - gt * L.g.cupH * L.scale;
        gi === 0 ? ctx.moveTo(L.cx - gw0, gy0) : ctx.lineTo(L.cx - gw0, gy0);
      }
      for (gi = GN; gi >= 0; gi--) {
        gt = 0.06 + 0.88 * (gi / GN);
        gw0 = profileAt(gt) * L.g.halfW * 0.52 * L.scale;
        gy0 = L.baseY - gt * L.g.cupH * L.scale;
        ctx.lineTo(L.cx - gw0, gy0);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,' + cur.deco.glass + ')';
      ctx.fill();
    }

    // 合格区 / 完美区色带（按 cups.js 规则：绿带贴合格带顶、宽 1/3）
    var qw = Math.max(cur.qhi - cur.qlo, 0.24);
    var qlo = Math.max(0.15, cur.qhi - qw), pw = (cur.qhi - qlo) / 3, plo = cur.qhi - pw;
    ctx.save();
    cupPath(L, 0);
    ctx.clip();
    band(L, qlo, cur.qhi, 'rgba(232,163,61,0.28)');
    band(L, plo, cur.qhi, 'rgba(105,176,86,0.38)');
    ctx.restore();

    // 杯壁（开口路径：杯口无描边线，与游戏一致）
    wallPath(L);
    ctx.strokeStyle = cur.deco.wall; ctx.lineWidth = cur.deco.wallW * L.scale * 1.6;
    ctx.lineJoin = 'round'; ctx.stroke();
    // 杯底描边加粗（2 倍边线宽，与游戏一致）
    var bw0 = profileAt(0) * L.g.halfW * L.scale;
    ctx.beginPath(); ctx.moveTo(L.cx - bw0, L.baseY); ctx.lineTo(L.cx + bw0, L.baseY);
    ctx.lineWidth = cur.deco.wallW * L.scale * 1.6 * 2; ctx.stroke();

    // 高脚
    if (cur.stem) {
      var footY = L.baseY + g.cupH * 0.2 * L.scale;
      ctx.beginPath(); ctx.moveTo(L.cx, L.baseY); ctx.lineTo(L.cx, footY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(L.cx - g.halfW * 0.45 * L.scale, footY);
      ctx.lineTo(L.cx + g.halfW * 0.45 * L.scale, footY); ctx.stroke();
    }

    // 杯把（参数化：上/下附着点 + 外扩幅度，可拖拽节点调整）
    handleNodes = [];
    if (cur.deco.handle.on) {
      var hh = cur.deco.handle;
      var hw1 = profileAt(hh.t1) * g.halfW * L.scale, hw2 = profileAt(hh.t2) * g.halfW * L.scale;
      var hy1 = L.baseY - hh.t1 * g.cupH * L.scale, hy2 = L.baseY - hh.t2 * g.cupH * L.scale;
      var hOut = g.halfW * hh.out * L.scale;
      ctx.beginPath();
      ctx.moveTo(L.cx + hw1 - 2, hy1);
      ctx.bezierCurveTo(L.cx + hw1 + hOut, hy1, L.cx + hw2 + hOut, hy2, L.cx + hw2 - 2, hy2);
      ctx.bezierCurveTo(L.cx + hw2 + hOut * 0.45, hy2 + 8, L.cx + hw1 + hOut * 0.45, hy1 - 8, L.cx + hw1 - 2, hy1);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
      ctx.strokeStyle = cur.deco.wall; ctx.lineWidth = Math.max(2, cur.deco.wallW * L.scale * 1.6 - 1); ctx.stroke();
      // 杯把控制节点：上附着点(上下拖) / 下附着点(上下拖) / 外扩点(左右拖)
      handleNodes = [
        { role: 't1', x: L.cx + hw1, y: hy1 },
        { role: 't2', x: L.cx + hw2, y: hy2 },
        { role: 'out', x: L.cx + Math.max(hw1, hw2) + hOut, y: (hy1 + hy2) / 2 }
      ];
    }

    // 内壁刻度线
    if (cur.deco.ticks > 0) {
      ctx.strokeStyle = cur.deco.wall; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5;
      for (var tk = 1; tk <= cur.deco.ticks; tk++) {
        var tt = tk / (cur.deco.ticks + 1);
        var tw = profileAt(tt) * g.halfW * L.scale - 3;
        if (tw < 8) continue;
        var ty = L.baseY - tt * g.cupH * L.scale;
        var tl = Math.max(4, Math.min(14, tw * 0.25));
        ctx.beginPath(); ctx.moveTo(L.cx + tw, ty); ctx.lineTo(L.cx + tw - tl, ty); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // 合格区分隔虚线
    if (cur.deco.dash) {
      ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(43,42,38,0.30)'; ctx.lineWidth = 1;
      [qlo, cur.qhi].forEach(function (lv) {
        var wAt = profileAt(lv) * g.halfW * L.scale;
        var yy = L.baseY - lv * g.cupH * L.scale;
        ctx.beginPath(); ctx.moveTo(L.cx - wAt, yy); ctx.lineTo(L.cx + wAt, yy); ctx.stroke();
      });
      ctx.restore();
    }

    // 杯口最小宽度参考线（游戏 MOUTH_MIN=18px）
    var rimY = ptXY(1, 0, L).y;
    ctx.setLineDash([4, 4]); ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L.cx - MOUTH_MIN * L.scale, rimY - 8); ctx.lineTo(L.cx - MOUTH_MIN * L.scale, rimY + 8);
    ctx.moveTo(L.cx + MOUTH_MIN * L.scale, rimY - 8); ctx.lineTo(L.cx + MOUTH_MIN * L.scale, rimY + 8); ctx.stroke();
    ctx.setLineDash([]);

    // 控制点（右壁实心可拖，左壁镜像空心）
    for (var i = 0; i < NPTS; i++) {
      var t = i / (NPTS - 1);
      var pr = ptXY(t, cur.pts[i], L), pl = ptXY(t, -cur.pts[i], L);
      ctx.beginPath(); ctx.arc(pl.x, pl.y, 4, 0, 7); ctx.fillStyle = '#d8d2c0'; ctx.fill();
      ctx.beginPath(); ctx.arc(pr.x, pr.y, 7, 0, 7);
      ctx.fillStyle = i === dragIdx ? '#e8a33d' : '#fff'; ctx.fill();
      ctx.strokeStyle = '#e8a33d'; ctx.lineWidth = 2; ctx.stroke();
    }

    // 杯把控制节点（菱形：上下两个调附着高度，右侧调外扩大小）
    for (var hi = 0; hi < handleNodes.length; hi++) {
      var hn = handleNodes[hi];
      ctx.save(); ctx.translate(hn.x, hn.y); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = dragHandle === hn.role ? '#e8a33d' : '#fff';
      ctx.strokeStyle = '#e8a33d'; ctx.lineWidth = 2;
      ctx.fillRect(-6, -6, 12, 12); ctx.strokeRect(-6, -6, 12, 12);
      ctx.restore();
    }

    // 数据面板
    var aw = avgW();
    var rimPx = profileAt(1) * g.halfW;
    var html = '杯口半宽 <b>' + rimPx.toFixed(1) + ' px</b>' +
      (g.widened ? ' <span class="warn">（&lt;' + MOUTH_MIN + 'px，游戏会强制拉宽杯子！）</span>' : '') +
      '<br>杯高 <b>' + g.cupH.toFixed(0) + ' px</b> · 平均半宽 <b>' + aw.toFixed(2) + '</b>' +
      '<br>完美区 <b>' + plo.toFixed(2) + ' ~ ' + cur.qhi.toFixed(2) + '</b>（宽 ' + pw.toFixed(2) + '）';
    if (cur.pass.sprite) html += '<br><span class="warn">注意：此杯使用精灵图（sprite），改形状不会影响贴图外观</span>';
    document.getElementById('stats').innerHTML = html;
  }

  function band(L, lo, hi, color) {
    var y1 = L.baseY - lo * L.g.cupH * L.scale, y2 = L.baseY - hi * L.g.cupH * L.scale;
    ctx.fillStyle = color;
    ctx.fillRect(0, y2, cv.width, y1 - y2);
  }

  // ---------- 节奏图 ----------
  function drawSpeed() {
    var W = speedCv.width, H = speedCv.height, aw = avgW(), i, N = 60;
    var vals = [], max = 0;
    for (i = 0; i <= N; i++) {
      var w = profileAt(i / N), v = (aw * aw) / (w * w);
      vals.push(v); if (v > max) max = v;
    }
    sctx.clearRect(0, 0, W, H);
    // 合格区背景
    var qw = Math.max(cur.qhi - cur.qlo, 0.24), qlo = Math.max(0.15, cur.qhi - qw);
    sctx.fillStyle = 'rgba(232,163,61,0.15)';
    sctx.fillRect(qlo * W, 0, (cur.qhi - qlo) * W, H);
    sctx.beginPath();
    for (i = 0; i <= N; i++) {
      var x = (i / N) * W, y = H - 6 - (vals[i] / max) * (H - 14);
      i === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
    }
    sctx.strokeStyle = '#e8a33d'; sctx.lineWidth = 2; sctx.stroke();
    sctx.fillStyle = '#a8a291'; sctx.font = '10px sans-serif';
    sctx.fillText('杯底', 2, H - 2); sctx.fillText('杯口', W - 26, H - 2);
  }

  // ---------- 代码生成 ----------
  function genCode() {
    var pts = cur.pts.map(function (v) { return +v.toFixed(3); });
    var lines = [];
    lines.push('    {');
    lines.push("      name: '" + cur.name + "', hint: '" + cur.hint + "', aspect: " + (+cur.aspect.toFixed(2)) +
               ', stem: ' + cur.stem + ', size: ' + (+cur.size.toFixed(2)) + ', pool: ' + cur.pool + ',');
    PASS_FIELDS.forEach(function (f) {
      if (cur.pass[f] !== undefined) {
        var v = cur.pass[f];
        lines.push('      ' + f + ': ' + (typeof v === 'string' ? "'" + v + "'" : v) + ',');
      }
    });
    // 装饰：只在非默认时输出（默认外观与 game.js 一致，不必冗余）
    var decoParts = [];
    for (var dk in DECO_DEF) {
      if (dk === 'handle') continue;
      var dv = cur.deco[dk];
      if (dv !== DECO_DEF[dk]) decoParts.push(dk + ': ' + (typeof dv === 'string' ? "'" + dv + "'" : dv));
    }
    if (cur.deco.handle.on) {
      var hh = cur.deco.handle;
      var hdef = hh.t1 === 0.82 && hh.t2 === 0.45 && hh.out === 0.62;
      decoParts.push(hdef ? 'handle: true'
        : 'handle: { t1: ' + hh.t1 + ', t2: ' + hh.t2 + ', out: ' + hh.out + ' }');
    }
    if (decoParts.length) lines.push('      deco: { ' + decoParts.join(', ') + ' },');
    // 数组折行，每行 6 个数
    var arr = '      profile: tableProfile([';
    for (var i = 0; i < pts.length; i++) {
      if (i % 6 === 0) arr += '\n        ';
      arr += pts[i] + (i < pts.length - 1 ? ', ' : '');
    }
    arr += ']),';
    lines.push(arr);
    lines.push('      zones: { q: [' + (+cur.qlo.toFixed(2)) + ', ' + (+cur.qhi.toFixed(2)) + '] }');
    lines.push('    }');
    document.getElementById('codeOut').value = lines.join('\n');
    return lines.join('\n');
  }

  // ---------- 面板同步 ----------
  function $(id) { return document.getElementById(id); }
  function syncPanel() {
    $('fName').value = cur.name; $('fHint').value = cur.hint;
    $('fAspect').value = cur.aspect; $('fSize').value = cur.size;
    $('fStem').checked = cur.stem;
    $('fPool').value = String(cur.pool);
    $('fQlo').value = cur.qlo; $('fQhi').value = cur.qhi;
    $('fWall').value = cur.deco.wall;
    $('fWallW').value = cur.deco.wallW; $('fGlass').value = cur.deco.glass;
    $('fTicks').value = cur.deco.ticks;
    $('fDash').checked = cur.deco.dash; $('fHandle').checked = cur.deco.handle.on;
    syncVals();
  }
  function syncVals() {
    $('vAspect').textContent = (+cur.aspect).toFixed(2);
    $('vSize').textContent = (+cur.size).toFixed(2);
    $('vQlo').textContent = (+cur.qlo).toFixed(2);
    $('vQhi').textContent = (+cur.qhi).toFixed(2);
    $('vWallW').textContent = (+cur.deco.wallW).toFixed(1);
    $('vGlass').textContent = (+cur.deco.glass).toFixed(2);
    $('vTicks').textContent = cur.deco.ticks;
  }
  function bindField(id, key, isNum) {
    $(id).addEventListener('input', function () {
      cur[key] = isNum ? parseFloat(this.value) : this.value;
      if (key === 'qlo' && cur.qlo >= cur.qhi) cur.qlo = cur.qhi - 0.01;
      if (key === 'qhi' && cur.qhi <= cur.qlo) cur.qhi = cur.qlo + 0.01;
      syncVals(); draw(); drawSpeed(); genCode();
    });
  }
  function bindDeco(id, key, kind) { // kind: num | int | str | bool
    $(id).addEventListener('input', function () {
      var v = kind === 'bool' ? this.checked
            : kind === 'int' ? parseInt(this.value, 10)
            : kind === 'num' ? parseFloat(this.value) : this.value;
      cur.deco[key] = v;
      syncVals(); draw(); genCode();
    });
  }
  bindField('fName', 'name'); bindField('fHint', 'hint');
  bindField('fAspect', 'aspect', true); bindField('fSize', 'size', true);
  bindField('fQlo', 'qlo', true); bindField('fQhi', 'qhi', true);
  $('fStem').addEventListener('change', function () { cur.stem = this.checked; draw(); genCode(); });
  $('fPool').addEventListener('change', function () { cur.pool = parseInt(this.value, 10); genCode(); renderList(); });
  bindDeco('fWall', 'wall', 'str'); bindDeco('fWallW', 'wallW', 'num');
  bindDeco('fGlass', 'glass', 'num'); bindDeco('fTicks', 'ticks', 'int');
  bindDeco('fDash', 'dash', 'bool');
  $('fHandle').addEventListener('change', function () { cur.deco.handle.on = this.checked; draw(); genCode(); });

  // ---------- 拖拽 ----------
  var dragIdx = -1, dragHandle = null, handleNodes = [];
  function cvPos(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) };
  }
  cv.addEventListener('pointerdown', function (e) {
    var p = cvPos(e), L = layout();
    // 杯把节点优先（菱形：t1/t2 上下拖，out 左右拖）
    for (var h = 0; h < handleNodes.length; h++) {
      if (Math.hypot(p.x - handleNodes[h].x, p.y - handleNodes[h].y) < 14) {
        dragHandle = handleNodes[h].role; cv.setPointerCapture(e.pointerId); draw(); return;
      }
    }
    for (var i = 0; i < NPTS; i++) {
      var hp = ptXY(i / (NPTS - 1), cur.pts[i], L);
      if (Math.hypot(p.x - hp.x, p.y - hp.y) < 14) { dragIdx = i; cv.setPointerCapture(e.pointerId); draw(); return; }
    }
  });
  cv.addEventListener('pointermove', function (e) {
    var p = cvPos(e), L = layout();
    if (dragHandle) {
      var g = L.g, hh = cur.deco.handle;
      if (dragHandle === 't1' || dragHandle === 't2') {
        var t = (L.baseY - p.y) / (g.cupH * L.scale);
        if (dragHandle === 't1') hh.t1 = Math.round(Math.max(hh.t2 + 0.1, Math.min(0.97, t)) * 100) / 100;
        else hh.t2 = Math.round(Math.max(0.03, Math.min(hh.t1 - 0.1, t)) * 100) / 100;
      } else {
        var base = Math.max(profileAt(hh.t1), profileAt(hh.t2));
        hh.out = Math.round(Math.max(0.15, Math.min(1.3, (p.x - L.cx) / (g.halfW * L.scale) - base)) * 100) / 100;
      }
      draw(); genCode(); return;
    }
    if (dragIdx < 0) return;
    var w = (p.x - L.cx) / (L.g.halfW * L.scale);
    cur.pts[dragIdx] = Math.round(Math.max(0.05, Math.min(1, w)) * 1000) / 1000;
    draw(); drawSpeed(); genCode();
  });
  cv.addEventListener('pointerup', function () { dragIdx = -1; dragHandle = null; draw(); });

  // ---------- 列表（按段位独立杯池分组） ----------
  var TIER_LABELS = ['倒奶 · 人类幼崽', '可乐 · 元气少年', '麦芽 · 未来可期', '葡萄汁 · 职场新人', '玉露 · 职场中坚', '茶 · 人间清醒'];
  function renderList() {
    var box = $('items'), html = '', lastPool = -1;
    for (var i = 0; i < Cups.CUPS.length; i++) {
      var c = Cups.CUPS[i], pool = c.pool || 0;
      if (pool !== lastPool) {
        lastPool = pool;
        html += '<div class="grp">' + (pool >= 9 ? '试制 · 参考图杯型（不进游戏）' : '段位' + pool + ' · ' + (TIER_LABELS[pool] || '未知')) + '</div>';
      }
      html += '<div class="item' + (cur && cur.index === i ? ' on' : '') + '" data-i="' + i + '">' +
              c.name + '<div class="sub">' + c.hint + ' · 高宽比 ' + c.aspect + '</div></div>';
    }
    if (cur && cur.index === null) html += '<div class="item on">新杯型（未保存）</div>';
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll('.item[data-i]'), function (el) {
      el.addEventListener('click', function () { loadCup(+this.dataset.i); });
    });
  }

  // ---------- 操作 ----------
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.style.opacity = 1;
    setTimeout(function () { t.style.opacity = 0; }, 2200);
  }
  $('newBtn').addEventListener('click', newCup);
  $('resetBtn').addEventListener('click', function () {
    cur = JSON.parse(JSON.stringify(snapshot));
    syncPanel(); draw(); drawSpeed(); genCode(); toast('已重置');
  });
  $('copyBtn').addEventListener('click', function () {
    var ta = $('codeOut'); ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject())
      .then(function () { toast('代码已复制'); })
      .catch(function () { document.execCommand('copy'); toast('代码已复制'); });
  });
  $('saveBtn').addEventListener('click', function () {
    fetch('/save-cup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ index: cur.index, code: genCode() })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res.ok) throw new Error(res.error || '保存失败');
      toast(cur.index === null ? '已追加到 cups.js（第 ' + res.count + ' 个）' : '已保存，cups.js 已更新');
      // 刷新本地杯型库与列表
      return fetch('src/cups.js?_=' + Date.now());
    }).then(function (r) {
      if (!r) return;
      return r.text().then(function (txt) {
        var winCups = window.Cups;
        new Function('window', txt.replace(/typeof self !== 'undefined' \? self : this/, 'window'))(window);
        if (cur.index === null) cur.index = Cups.CUPS.length - 1;
        snapshot = JSON.parse(JSON.stringify(cur));
        renderList();
      });
    }).catch(function (e) {
      toast('保存失败：' + e.message + '（请通过 npm run dev 打开本页）');
    });
  });

  // ---------- 启动 ----------
  loadCup(0);
})();
</script>
</body>
</html>
